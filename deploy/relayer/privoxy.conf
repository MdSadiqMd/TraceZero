# Purpose: Bridge between relayer's HTTP RPC calls and Tor SOCKS5
# Flow (Docker): Relayer → Privoxy (tor-privoxy:8118) → Tor SOCKS5 (tor:9050) → Internet → Solana RPC
# Flow (bare-metal): Relayer → Privoxy (127.0.0.1:8118) → Tor SOCKS5 (127.0.0.1:9050) → Internet → Solana RPC

# Listen Address
# In Docker: accept connections from any container in tracezero-internal network
# On EC2 bare-metal: bind to 127.0.0.1 only
listen-address 0.0.0.0:8118

# Forward to Tor
# Route ALL traffic through Tor SOCKS5 proxy
# In Docker: use the 'tor' service hostname (Docker internal DNS)
# On EC2 bare-metal: replace 'tor' with '127.0.0.1'
forward-socks5t / tor:9050 .

# Timeouts
# Tor adds 500ms-2s latency per request
# Set generous timeouts to avoid premature failures
socket-timeout 120
keep-alive-timeout 300
default-server-timeout 120

# Privacy: Disable ALL Logging
# We do NOT want to log URLs (they contain RPC endpoints and potentially sensitive data)
debug 0
logfile /dev/null

# Disable ALL Content Filtering
# Privoxy is ONLY a proxy here, not a filter
# We don't want it modifying requests/responses in any way
toggle 0
enable-remote-toggle 0
enable-remote-http-toggle 0
enable-edit-actions 0

# Performance
# Buffer size for passing data
buffer-limit 16384

# Allow keep-alive connections (reuse Tor circuits where possible)
keep-alive-timeout 300
connection-sharing 1

# Security
# Don't reveal Privoxy is running
# Remove identifying headers
# (Empty string disables the informational page)
admin-address ""
proxy-info-url ""

# Don't accept requests to Privoxy's internal pages from outside
enforce-blocks 0
